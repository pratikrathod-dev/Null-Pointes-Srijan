<!-- Tabspace mark: three stacked cards, the front one a folder, with a star.

     This is the source of truth for every icon the extension ships. It replaces
     a 512px screenshot of an app-icon mockup (grey page, white card, drop shadow
     and all), which is why the old icons carried a shadow smudge, two sets of
     rounded corners at slightly different radii, and a star that collapsed into
     a grey blob at 16px. The geometry here is traced from that artwork, so the
     mark is the same; it is simply drawn rather than resampled.

     Sizes 48 and up render from this file. 16 and 32 render from icon-small.svg,
     which drops a layer and grows the star, because three cards and a five point
     star cannot survive 16 pixels.

     Note for editors: XML comments may not contain a double hyphen. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#7bd9ee"/>
      <stop offset="1" stop-color="#55bedb"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#abecf1"/>
      <stop offset="1" stop-color="#7ccfe3"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2790c2"/>
      <stop offset="1" stop-color="#52c7d8"/>
    </linearGradient>
  </defs>

  <rect x="36"  y="154" width="334" height="307" rx="27" fill="url(#back)"/>
  <rect x="83"  y="109" width="331" height="300" rx="27" fill="url(#mid)"/>

  <!-- The folder: tab across the left of the top edge, stepping down to the
       body on the right. -->
  <path fill="url(#front)" d="
    M 168 50
    H 301
    q 22 0 33 18
    q 8 14 25 14
    H 449
    a 27 27 0 0 1 27 27
    V 331
    a 27 27 0 0 1 -27 27
    H 168
    a 27 27 0 0 1 -27 -27
    V 77
    a 27 27 0 0 1 27 -27
    Z"/>

  <path fill="#1d84b4" d="
    M 415 134 l 9.0 18.2 20.1 2.9 -14.5 14.2 3.4 20.0 -18.0 -9.4 -18.0 9.4
    3.4 -20.0 -14.5 -14.2 20.1 -2.9 Z"/>
</svg>
