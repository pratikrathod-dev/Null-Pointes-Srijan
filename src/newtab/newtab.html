<!DOCTYPE html>
<html lang="en" data-theme="light" data-font="inter">
<head>
  <meta charset="UTF-8" />
  <title>Tabspace</title>
  <link rel="stylesheet" href="newtab.css" />
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand__mark" id="brand-mark"></span>
        <span class="brand__name">Tabspace</span>
      </div>

      <div class="sidebar__switch" role="tablist" aria-label="Sidebar view">
        <button class="switch-tab is-active" id="view-tabs" role="tab" aria-selected="true">
          <span>Open tabs</span>
          <span class="switch-tab__count" id="tab-count">0</span>
        </button>
        <button class="switch-tab" id="view-news" role="tab" aria-selected="false">
          <span>AI news</span>
          <span class="switch-tab__dot" id="news-dot" hidden></span>
        </button>
        <button class="switch-tab" id="view-routines" role="tab" aria-selected="false">
          <span>Routines</span>
          <span class="switch-tab__dot" id="routines-dot" hidden></span>
        </button>
      </div>

      <div class="sidebar__view" id="panel-tabs" role="tabpanel">
        <div class="sidebar__tools">
          <button class="btn btn--quiet btn--sm" id="btn-stash">Stash all</button>
          <button class="btn btn--quiet btn--sm" id="btn-sort-tabs">Sort</button>
          <button class="btn btn--quiet btn--sm" id="btn-close-dupes">Dedupe</button>
        </div>

        <div class="routine-slot" id="routine-offer" hidden></div>
        <div class="hint">Drag a tab onto a folder to save it. Shift-click to grab several at once.</div>
        <div class="tab-list" id="tab-list"></div>
        <div class="related-panel" id="related-panel" hidden>
          <div class="related-panel__header">
            <span class="related-panel__title">Related</span>
            <span class="related-panel__tab" id="related-tab"></span>
          </div>
          <div class="related-list" id="related-list"></div>
        </div>

        <div class="save-suggest" id="save-suggest" hidden>
          <div class="save-suggest__header">
            <span class="save-suggest__title">Worth saving?</span>
            <button class="icon-btn icon-btn--sm" id="save-suggest-dismiss" title="Dismiss"></button>
          </div>
          <div class="save-suggest__list" id="save-suggest-list"></div>
        </div>
      </div>

      <div class="sidebar__view" id="panel-news" role="tabpanel" hidden>
        <div class="news__bar">
          <div class="seg" id="news-range" role="radiogroup" aria-label="Period">
            <button class="seg__btn is-active" data-range="daily" role="radio" aria-checked="true">Today</button>
            <button class="seg__btn" data-range="weekly" role="radio" aria-checked="false">This week</button>
          </div>
          <span class="spacer"></span>
          <button class="icon-btn icon-btn--sm" id="btn-news-refresh" title="Refresh the news"></button>
        </div>
        <div class="news__status" id="news-updated"></div>
        <div class="news-list" id="news-list"></div>
      </div>

      <div class="sidebar__view" id="panel-routines" role="tabpanel" hidden>
        <div class="routines-scroll" id="routines-body"></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="btn-sidebar" title="Show or hide the sidebar"></button>
        <button class="icon-btn" id="btn-news" title="Hot AI and tech news"></button>
        <div class="topbar__divider"></div>
        <div class="spaces" id="spaces"></div>
        <div class="search">
          <input class="field" type="search" id="search" placeholder="Search everything" />
        </div>
        <span class="sync-pill" id="sync-pill"></span>
        <button class="account" id="btn-account"></button>
        <div class="topbar__divider"></div>
        <button class="icon-btn" id="btn-tags" title="Manage tags"></button>
        <button class="icon-btn" id="btn-theme" title="Switch theme"></button>
        <button class="icon-btn" id="btn-settings" title="Settings"></button>
      </header>

      <div class="tagbar" id="tagbar"></div>

      <div class="board-scroll" id="board-scroll">
        <div class="board-wrap" id="board-wrap">
          <div class="board" id="board"></div>
          <div class="canvas-layer" id="canvas"></div>
        </div>
      </div>

      <footer class="statusbar">
        <button class="btn btn--quiet btn--sm" id="btn-add-folder">New folder</button>
        <button class="btn btn--quiet btn--sm" id="btn-add-note">New note</button>
      </footer>
    </main>
  </div>

  <div class="toasts" id="toasts"></div>
  <script type="module" src="newtab.js"></script>
</body>
</html>
