<!-- Tabspace mark at 16px, where the icon is a shape and nothing else.

     Everything here is sized so that no feature is thinner than about two device
     pixels at 16px, because anything finer lands as a grey half-pixel:

       * two layers, offset far enough that the card behind reads as a card and
         not as a soft edge on the folder;
       * a tab that drops a full quarter of the folder's height, so the notch in
         the top edge is still a notch after rounding;
       * no star. At 16px a five point star is three pixels across and lands as
         a white smudge that reads as a rendering fault, so the silhouette is
         left to do the identifying. The star returns at 32px.

     Same palette and the same two shapes as icon.svg, just louder. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#9ce4ee"/>
      <stop offset="1" stop-color="#6cc7df"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2087bd"/>
      <stop offset="1" stop-color="#46bcd2"/>
    </linearGradient>
  </defs>

  <rect x="16" y="176" width="368" height="320" rx="36" fill="url(#mid)"/>

  <path fill="url(#front)" d="
    M 164 16
    H 300
    q 28 0 42 26
    q 14 26 36 26
    H 460
    a 36 36 0 0 1 36 36
    V 380
    a 36 36 0 0 1 -36 36
    H 164
    a 36 36 0 0 1 -36 -36
    V 52
    a 36 36 0 0 1 36 -36
    Z"/>
</svg>
